<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeBounty 2.0</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =====================================
         CINEMATIC INTRO
    ====================================== -->

    <section
        class="intro-section"
        id="introSection"
    >

        <!-- =================================
             PIG AIRSHIP
        ================================== -->

        <div
            class="ship-wrapper"
            id="shipWrapper"
        >

            <img
                src="assets/pig-ship.png"
                alt="Pig Airship"
                class="pig-ship"
            >

        </div>



        <!-- =================================
             NEST
        ================================== -->

        <div class="nest-container">


            <!-- BACK HALF -->

            <img
                src="assets/nest-back.png"
                alt=""
                class="nest-back"
            >



            <!-- EGGS -->

            <div
                class="eggs"
                id="eggs"
            >

                <img
                    src="assets/egg.png"
                    alt="Egg"
                    class="egg egg-left"
                >

                <img
                    src="assets/egg.png"
                    alt="Egg"
                    class="egg egg-center"
                >

                <img
                    src="assets/egg.png"
                    alt="Egg"
                    class="egg egg-right"
                >

            </div>



            <!-- FRONT HALF -->

            <img
                src="assets/nest-front.png"
                alt=""
                class="nest-front"
            >

        </div>


    </section>



    <script src="script.js"></script>

</body>

</html>
